version: '3.8'

services:
  web:
    build: ./web
    ports:
      - "8080:80"
    volumes:
      - ./web:/var/www/html
    depends_on:
      - db

  db:
    image: mysql:5.7
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE: sgsconnect
      MYSQL_USER: user
      MYSQL_PASSWORD: userpass
    volumes:
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
